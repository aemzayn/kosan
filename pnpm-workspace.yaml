packages:
  - 'packages/*'
  - 'examples/*'
  - 'docs'
# Dependencies whose install scripts may run. Native SQLite drivers are needed
# by the sequelize/cli/drizzle test suites; biome and esbuild fetch binaries.
# @nestjs/core's script only prints a funding message.
allowBuilds:
  '@biomejs/biome': true
  '@nestjs/core': false
  better-sqlite3: true
  esbuild: true
  sqlite3: true
