version: '3.9'

services:
  master:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: master
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d master']
      interval: 5s
      timeout: 5s
      retries: 5

  acme_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acme_db
      POSTGRES_USER: acme_user
      POSTGRES_PASSWORD: acme_pass
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acme_user -d acme_db']
      interval: 5s
      timeout: 5s
      retries: 5

  globex_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: globex_db
      POSTGRES_USER: globex_user
      POSTGRES_PASSWORD: globex_pass
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U globex_user -d globex_db']
      interval: 5s
      timeout: 5s
      retries: 5

  initech_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: initech_db
      POSTGRES_USER: initech_user
      POSTGRES_PASSWORD: initech_pass
    ports:
      - '5435:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U initech_user -d initech_db']
      interval: 5s
      timeout: 5s
      retries: 5
