# Three independent Postgres servers:
#   master     — the Kosan tenant registry (one row per tenant)
#   region-eu  — hosts EU tenants' databases
#   region-us  — hosts US tenants' databases
#
# Ports 5450-5452 avoid clashing with the other examples (5432-5435).
services:
  master:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: master
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5450:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d master"]
      interval: 3s
      timeout: 3s
      retries: 20

  region-eu:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5451:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 3s
      timeout: 3s
      retries: 20

  region-us:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5452:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 3s
      timeout: 3s
      retries: 20
