name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # typecheck builds packages first so workspace deps resolve to dist/*.d.ts
      - run: pnpm typecheck

  integration:
    name: Integration (Node ${{ matrix.node }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
        db: [postgres, mysql]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: kosan
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kosan
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -uroot -pkosan --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each job runs the suites against one database; the other URL is empty
      # so those tests skip.
      - run: pnpm test:integration
        env:
          KOSAN_TEST_POSTGRES_URL: ${{ matrix.db == 'postgres' && 'postgres://postgres:kosan@localhost:5432/postgres' || '' }}
          KOSAN_TEST_MYSQL_URL: ${{ matrix.db == 'mysql' && 'mysql://root:kosan@localhost:3306/mysql' || '' }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Verify dist exists for all packages
        run: |
          for pkg in packages/*/; do
            [ -d "${pkg}dist" ] || (echo "Missing dist in $pkg" && exit 1)
          done
          echo "All dist/ directories present"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
